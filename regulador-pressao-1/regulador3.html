<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulador 1º Estágio APR 85 8kg/h | HGconex</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
</head>
<body id="topo">

<div id="header"></div>

<!-- BANNER -->
<section class="banner-interno">
    <div class="banner-overlay">
        <h1>Regulador 1º Estágio APR 85 8kg/h</h1>
        <p>Regulador APR 85 de 8kg/h</p>
    </div>
</section>

<!-- PRODUTO -->
<section class="pagina-produtos">
    <div class="produto-individual">

        <!-- IMAGEM -->
        <div class="produto-img">
            <img src="../imagens/regulador-pressao-1-3.webp" alt="Regulador 1º Estágio APR 85 8kg/h">
        </div>

        <!-- INFO -->
        <div class="produto-info">
            <h2>Regulador 1º Estágio APR 85 8kg/h</h2>

            <p>Entrada e saída com roscas internas de 1/4, com regulagem externa, e com manômetro.</p>

            <h3>Pressão</h3>
            <ul>
                <li>Pressão de entrada: 2 a 18 BAR</li>
                <li>Pressão de saída: 0,5 a 2 BAR</li>
            </ul>

        </div>

    </div>
</section>
<div id="contato-area"></div>

    <div id="footer"></div>

<script>
    fetch("../contato.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("contato-area").innerHTML = data;
    });

    fetch("../footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
    });

    fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
    });
</script>


</body>
</html>
