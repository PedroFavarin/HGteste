<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotovelo Latão 90º NPT (F) X SAE | HGconex</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
</head>
<body id="topo">


    <div id="header"></div>

<!-- BANNER -->
<section class="banner-interno">
    <div class="banner-overlay">
        <h1>Cotovelo Latão 90º NPT (F) X SAE</h1>
        <p>Cotovelo latão rosqueável com saída para cobre</p>
    </div>
</section>

<!-- PRODUTO -->
<section class="pagina-produtos">
    <div class="produto-individual">

        <!-- IMAGEM -->
        <div class="produto-img">
            <img src="../imagens/cotovelo4.jpg" alt="Cotovelo Latão 90º NPT (F) X SAE">
        </div>

        <!-- INFO -->
        <div class="produto-info">
            <h2>Cotovelo Latão 90º NPT (F) X SAE</h2>

            <p>
                Cotovelo em latão 90º rosca NPT interna com saida para tubo de cobre.
            </p>

            <h3>Bitolas</h3>
           <ul>
                <li>1/2 NPT X 1/2 SAE</li>
                <li>1/2 NPT X 3/8 SAE</li>
                <li>1/4 NPT X 3/8 SAE</li>
            </ul>

        </div>

    </div>
</section>
<div id="contato-area"></div>

    <div id="footer"></div>

<script>
    fetch("../contato.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("contato-area").innerHTML = data;
    });

    fetch("../footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
    });

    fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
    });
</script>


</body>
</html>
