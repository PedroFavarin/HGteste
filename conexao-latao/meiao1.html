<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meia União NPT (M) X BICO | HGconex</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
</head>
<body id="topo">

<div id="header"></div>

<!-- BANNER -->
<section class="banner-interno">
    <div class="banner-overlay">
        <h1>Meia União NPT (M) X BICO</h1>
        <p>Conexão rosqueável macho com saída para mangueira</p>
    </div>
</section>

<!-- PRODUTO -->
<section class="pagina-produtos">
    <div class="produto-individual">

        <!-- IMAGEM -->
        <div class="produto-img">
            <img src="../imagens/meiao1_600.h_600.png" alt="Meia União NPT (M) X BICO">
        </div>

        <!-- INFO -->
        <div class="produto-info">
            <h2>Meia União NPT (M) X BICO</h2>

            <p>
                Conexão em latão com rosca externa NPT com saida bico para mangueira.
            </p>

            <h3>Bitolas</h3>
           <ul>
                <li>1/2 NPT x 3/8 Bico</li>
                <li>1/2 NPT x 1/4 Bico</li>
                <li>3/4 NPT x 3/8 Bico</li>
                <li>3/8 NPT x 3/8 Bico</li>
            </ul>

        </div>

    </div>
</section>
<div id="contato-area"></div>

    <div id="footer"></div>

<script>
    fetch("../contato.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("contato-area").innerHTML = data;
    });

    fetch("../footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
    });

    fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
    });
</script>


</body>
</html>
