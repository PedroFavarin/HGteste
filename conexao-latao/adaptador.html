<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptador Daco Macho (M) de 1/2 NPT | HGconex</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
</head>
<body id="topo">


    <div id="header"></div>

<!-- BANNER -->
<section class="banner-interno">
    <div class="banner-overlay">
        <h1>Adaptador Daco Macho (M) de 1/2 NPT</h1>
        <p>Adaptador de Mangueira Macho e Fêmea para fogão</p>
    </div>
</section>

<!-- PRODUTO -->
<section class="pagina-produtos">
    <div class="produto-individual">

        <!-- IMAGEM -->
        <div class="produto-img">
            <img src="../imagens/adaptador1.png" alt="Adaptador Daco Macho (M) de 1/2 NPT">
        </div>

        <!-- INFO -->
        <div class="produto-info">
            <h2>Adaptador Daco Macho (M) de 1/2 NPT</h2>

            <p>
                Adaptador Daco rosca externa para conectar no bico do fogão.
            </p>

        </div>

    </div>
</section>
    <div id="contato-area"></div>

    <div id="footer"></div>

<script>
    fetch("../contato.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("contato-area").innerHTML = data;
    });

    fetch("../footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
    });

    fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
    });
</script>


</body>
</html>
