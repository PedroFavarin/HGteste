<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraçadeira Rosca | HGconex</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
</head>
<body id="topo">

<div id="header"></div>

<!-- BANNER -->
<section class="banner-interno">
    <div class="banner-overlay">
        <h1>Abraçadeira Rosca s/ Fim</h1>
        <p>Abraçadeira para mangueiras de gás</p>
    </div>
</section>

<!-- PRODUTO -->
<section class="pagina-produtos">
    <div class="produto-individual">

        <!-- IMAGEM -->
        <div class="produto-img">
            <img src="../imagens/abracadeira_rosca_sem_fim_aco_6_3735_1_20260114135823.webp" alt="Abraçadeira Rosca">
        </div>

        <!-- INFO -->
        <div class="produto-info">
            <h2>Abraçadeira Rosca s/ Fim</h2>

            <p>
                Fornecida em aço inox com acabamento superficial zincada, de uso em mangueiras Bico x Bico e Mangueira plástica.
            </p>

            <h3>Tamanhos</h3>
            <ul>
                <li>1/2 x 3/4</li>
            </ul>

        </div>

    </div>
</section>

    <div id="contato-area"></div>

    <div id="footer"></div>

<script>
    fetch("../contato.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("contato-area").innerHTML = data;
    });

    fetch("../footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
    });

    fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
    });
</script>


</body>
</html>
