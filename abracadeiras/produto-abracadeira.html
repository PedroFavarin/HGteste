<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Abraçadeiras | HGconex</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
</head>
<body id="topo">


    <div id="header"></div>

<!-- PRODUTOS -->
<section class="pagina-produtos">
    <div class="grid-produtos">

        <!-- CARD 1 -->
        <div class="card-produto">
            <img src="../imagens/abracadeira_rosca_sem_fim_aco_6_3735_1_20260114135823.webp" alt="Abraçadeira Rosca s/ Fim">

        <!-- CARD 2 -->
        <div class="card-produto">

        </div>

        <!-- pode adicionar quantas quiser -->

    </div>
</section>

    <div id="contato-area"></div>

    <div id="footer"></div>

<script>
    fetch("../contato.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("contato-area").innerHTML = data;
    });

    fetch("../footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
    });

    fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
    });
</script>

</html>
