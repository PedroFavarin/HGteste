<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangueiras Plásticas | HGconex</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
</head>
<body id="topo">


    <div id="header"></div>

<!-- BANNER -->
<section class="banner-interno">
    <div class="banner-overlay">
        <h1>Mangueiras Plásticas</h1>
        <p>Opção leve e funcional para instalações específicas</p>
    </div>
</section>

<!-- PRODUTOS -->
<section class="pagina-produtos">
    <div class="grid-produtos">

        <!-- CARD 1 -->
        <div class="card-produto">
            <img src="../imagens/mangueira-plastica.jpeg" alt="Mangueira Plástica para Gás normatizada">
            <h3>Mangueira Plásticas p/ Gás Normatizada</h3>
            <p>Mangueira Plástica Normatizada.</p>
            <a href="mangueira-plastica.html" target="_self">Saiba mais</a>
        </div>
    </div>
</section>

    <div id="contato-area"></div>

    <div id="footer"></div>

<script>
    fetch("../contato.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("contato-area").innerHTML = data;
    });

    fetch("../footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
    });

     fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
    });
</script>

</body>
</html>
