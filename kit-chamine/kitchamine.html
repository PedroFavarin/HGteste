<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIT Chaminé p/ aquecedor | HGconex</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
</head>
<body id="topo">

<div id="header"></div>

<!-- BANNER -->
<section class="banner-interno">
    <div class="banner-overlay">
        <h1>KIT Chaminé p/ Aquecedor</h1>
        <p>Kit para exaustão de aquecedor a gás</p>
    </div>
</section>

<!-- PRODUTO -->
<section class="pagina-produtos">
    <div class="produto-individual">

        <!-- IMAGEM -->
        <div class="produto-img">
            <img src="../imagens/kitchamine.w_600.h_600.jpg" alt="Kit chaminé p/ Aquecedor">
        </div>

        <!-- INFO -->
        <div class="produto-info">
            <h2>KIT Chaminé p/ Aquecedor</h2>

            <p>
                Kit com aro, abraçadeiras, chapéu e o tubo chegando a 1 metro e 50cm. 
            </p>

            <h3>Tamanhos</h3>
            <ul>
                <li>60</li>
                <li>80</li>
                <li>100</li>
            </ul>

        </div>

    </div>
</section>
<div id="contato-area"></div>

    <div id="footer"></div>

<script>
    fetch("../contato.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("contato-area").innerHTML = data;
    });

    fetch("../footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
    });

    fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
    });
</script>


</body>
</html>
