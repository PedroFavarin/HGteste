<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aro de Acabamento p/ Aquecedor | HGconex</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
</head>
<body id="topo">

<div id="header"></div>

<!-- BANNER -->
<section class="banner-interno">
    <div class="banner-overlay">
        <h1>Aro de Acabamento p/ Aquecedor</h1>
        <p>Aro de arremate confeccionado em alumínio</p>
    </div>
</section>

<!-- PRODUTO -->
<section class="pagina-produtos">
    <div class="produto-individual">

        <!-- IMAGEM -->
        <div class="produto-img">
            <img src="../imagens/aro.w_600.h_600.jpg" alt="Aro de acabamento">
        </div>

        <!-- INFO -->
        <div class="produto-info">
            <h2>Aro de Acabamento p/ Aquecedor</h2>

            <p>É utilizado para dar acabamento nos furos da parede ou gesso por onde passará uma tubulação.</p>

            <h3>Tamanhos</h3>
            <ul>
                <li>60</li>
                <li>80</li>
                <li>100</li>
            </ul>

        </div>

    </div>
</section>
<div id="contato-area"></div>

    <div id="footer"></div>

<script>
    fetch("../contato.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("contato-area").innerHTML = data;
    });

    fetch("../footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
    });

    fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
    });
</script>


</body>
</html>
