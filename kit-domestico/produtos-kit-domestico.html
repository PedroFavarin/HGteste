<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kits Domésticos | HGconex</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
</head>
<body id="topo">

<div id="header"></div>

<!-- BANNER -->
<section class="banner-interno">
    <div class="banner-overlay">
        <h1>Kits Domésticos</h1>
        <p>Escolha o modelo ideal para sua instalação</p>
    </div>
</section>

<!-- PRODUTOS -->
<section class="pagina-produtos">
    <div class="grid-produtos">

        <!-- CARD 1 -->
        <div class="card-produto">
            <img src="../imagens/kit-domestico1.jpg" alt="Kit Domestico p/ Gás de 1kg/h Imar">
            <h3>Kit Doméstico p/ Gás de 1kg/h Imar</h3>
            <p>Kit para exaustão de aquecedor a gás.</p>
            <a href="kit-domestico1.html" target="_self">Saiba mais</a>
        </div>

        <!-- CARD 2 -->
        <div class="card-produto">
            <img src="../imagens/kit-domestico2.jpg" alt="Kit Doméstico p/ Gás 1kg/h Formagás">
            <h3>Kit Doméstico p/ Gás 1kg/h Formagás</h3>
            <p>Kit de instalação para a central de gás do fogão.</p>
            <a href="kit-domentico2.html" target="_self">Saiba mais</a>
        </div>
    </div>
</section>
<div id="contato-area"></div>

    <div id="footer"></div>

<script>
    fetch("../contato.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("contato-area").innerHTML = data;
    });

    fetch("../footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
    });

    fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
    });
</script>


</body>
</html>
